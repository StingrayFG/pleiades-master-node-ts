syntax = "proto3";

package register.v1;

option go_package = "app/internal/gen/register/v1;registerv1";

import "health/v1/health.proto";

service RegisterService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
}

message RegisterNodeRequest {
  string node_id = 1;
  string hostname = 2;
  string port = 3;
  string scheme = 4;
  health.v1.HealthStatus health_status = 5;
}

message RegisterNodeResponse {}
