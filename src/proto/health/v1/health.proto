syntax = "proto3";

package health.v1;

option go_package = "app/internal/gen/health/v1;healthv1";

enum HealthSnapshotStatus {
  HEALTH_SNAPSHOT_STATUS_HEALTHY = 0;
  HEALTH_SNAPSHOT_STATUS_DEGRADED = 1;
}

message HealthSnapshot {
  HealthSnapshotStatus status = 1;
  bool database_ok = 2;
  bool storage_ok = 3;
  int64 storage_total_bytes = 4;
  int64 storage_free_bytes = 5;
  string message = 6;
}


service CheckHealthDataNode {
  rpc CheckHealthDataNode(CheckHealthDataNodeRequest) returns (CheckHealthDataNodeResponse);
}

message CheckHealthDataNodeRequest {}

message CheckHealthDataNodeResponse {
  HealthSnapshot health_snapshot = 1;
}
