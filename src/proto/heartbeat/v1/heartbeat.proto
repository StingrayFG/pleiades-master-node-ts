syntax = "proto3";

package heartbeat.v1;

option go_package = "app/internal/gen/heartbeat/v1;heartbeatv1";

import "health/v1/health.proto";

service HeartbeatDataNode {
  rpc HeartbeatDataNode(HeartbeatDataNodeRequest) returns (HeartbeatDataNodeResponse);
}

message HeartbeatDataNodeRequest {
  string node_id = 1;
  health.v1.HealthSnapshot health_snapshot = 2;
}

message HeartbeatDataNodeResponse {}
